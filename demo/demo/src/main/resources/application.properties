spring.application.name=demo

spring.datasource.url=jdbc:sqlite:ticketing.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# El esquema se crea a mano desde schema.sql (ver ese archivo: el generador
# de DDL de hibernate-community-dialects para SQLite no es confiable para
# columnas identity ni restricciones UNIQUE compuestas), asi que Hibernate no
# gestiona el DDL.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# SQLite solo admite un escritor a la vez: este margen (busy_timeout) hace que
# una escritura espere a que la otra termine en vez de fallar de inmediato con
# SQLITE_BUSY cuando hay contencion, como la que generan las reservas
# concurrentes de RNF-01.
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=30000

# Valores por defecto de desarrollo; en despliegue se sobreescriben importando
# el archivo externo con --spring.config.import=optional:file:./config/ventas.properties
# (ver config/ventas.properties). Nota: --spring.config.additional-location NO
# sirve aca, porque solo autocarga archivos llamados application.properties/.yml,
# no uno con otro nombre como ventas.properties.
ventas.max-entradas-por-compra=6
ventas.max-compras-simultaneas-por-usuario=3
ventas.politica-por-defecto=precio-base
ventas.minutos-de-vigencia-de-reserva=15
