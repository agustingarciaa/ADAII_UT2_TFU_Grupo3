spring.application.name=demo
spring.profiles.active=test

spring.datasource.url=jdbc:sqlite:target/test-db-${random.uuid}.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=30000

ventas.max-entradas-por-compra=6
ventas.max-compras-simultaneas-por-usuario=3
ventas.politica-por-defecto=precio-base
ventas.minutos-de-vigencia-de-reserva=15
