# Parametros operativos del motor de ventas.
#
# Este archivo vive FUERA del artefacto desplegado (el .jar). Un operador sin
# conocimiento tecnico puede editar estos valores y reiniciar el servicio para
# que el cambio quede activo, sin recompilar ni redesplegar nada.
#
# El proceso se arranca importando este archivo (que tiene un nombre propio, no
# application.properties, asi que hay que importarlo explicitamente):
#   java -jar demo.jar --spring.config.import=optional:file:./config/ventas.properties

# Cantidad maxima de entradas que un usuario puede pedir en una misma reserva.
ventas.max-entradas-por-compra=6

# Cantidad maxima de reservas pendientes (no vencidas) que un usuario puede
# tener abiertas al mismo tiempo.
ventas.max-compras-simultaneas-por-usuario=3

# Nombre de la politica de precio que se usa cuando el pedido no especifica
# una (debe coincidir con el nombre() de una PoliticaDePrecio registrada).
ventas.politica-por-defecto=precio-base

# Minutos que una reserva permanece PENDIENTE antes de expirar y liberar
# los asientos automaticamente.
ventas.minutos-de-vigencia-de-reserva=15
